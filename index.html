<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Tweetier</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">

  <!-- Auth Modal -->
  <div id="auth-modal">
    <div class="auth-card">
      <h2>Tweetier</h2>
      <div class="auth-tabs">
        <span id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Giriş Yap</span>
        <span id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">Kayıt Ol</span>
      </div>
      <form id="auth-form" onsubmit="handleAuth(event)">
        <div id="register-fields" class="hidden" style="margin-bottom: 15px;">
          <input type="text" id="reg-display-name" placeholder="Ad Soyad / Görünen İsim">
        </div>
        <input type="text" id="auth-username" placeholder="Kullanıcı Adı" required style="margin-bottom: 15px;">
        <input type="password" id="auth-password" placeholder="Şifre" required style="margin-bottom: 20px;">
        <button type="submit" id="auth-submit-btn" style="width: 100%;">Giriş Yap</button>
      </form>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="edit-profile-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span>Profil Düzenle</span>
        <button class="icon-btn" onclick="closeEditProfileModal()">✕</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <label style="font-size: 13px; font-weight: bold; color: var(--text-secondary);">Görünen İsim</label>
        <input type="text" id="edit-display-name" placeholder="Ad Soyad">
        
        <label style="font-size: 13px; font-weight: bold; color: var(--text-secondary);">Biyografi</label>
        <textarea id="edit-bio" rows="3" placeholder="Kendinizden bahsedin..."></textarea>

        <label style="font-size: 13px; font-weight: bold; color: var(--text-secondary);">Profil Fotoğrafı</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="text" id="edit-avatar-url" placeholder="Görsel URL veya dosya seçin">
          <input type="file" id="edit-avatar-file" accept="image/*" style="display: none;" onchange="handleAvatarFileSelect(event)">
          <button type="button" class="secondary" style="white-space: nowrap;" onclick="document.getElementById('edit-avatar-file').click()">Dosya Seç</button>
        </div>
        <div id="edit-avatar-preview" style="text-align: center; margin-top: 5px;">
          <img id="edit-avatar-img-preview" src="" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; display: none;">
        </div>

        <button onclick="saveProfileChanges()" style="margin-top: 10px; width: 100%;">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div id="create-group-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span>Yeni Grup Oluştur</span>
        <button class="icon-btn" onclick="closeCreateGroupModal()">✕</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        <label style="font-size: 13px; font-weight: bold; color: var(--text-secondary);">Grup Adı</label>
        <input type="text" id="group-name-input" placeholder="Grup adı girin...">

        <label style="font-size: 13px; font-weight: bold; color: var(--text-secondary);">Üye Ekle (Arkadaşlarım)</label>
        <div id="group-friends-select-list" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
          <!-- Populated by JS -->
        </div>

        <button onclick="submitCreateGroup()" style="margin-top: 10px; width: 100%;">Grubu Oluştur</button>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <sidebar>
      <div>
        <div class="logo-area">
          🐦 Tweetier
        </div>
        <div class="nav-links">
          <div class="nav-item active" onclick="switchTab('home')" id="nav-home">🏠 Ana Sayfa</div>
          <div class="nav-item" onclick="switchTab('messages')" id="nav-messages">💬 Mesajlar</div>
          <div class="nav-item" onclick="switchTab('friends')" id="nav-friends">👥 Arkadaşlar</div>
          <div class="nav-item" onclick="switchTab('profile')" id="nav-profile">👤 Profil</div>
        </div>
      </div>

      <div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-toggle-btn" style="width: 100%;">
          🌙 Koyu Tema
        </button>

        <div class="user-profile-badge" id="sidebar-user" style="cursor: pointer;" onclick="switchTab('profile')">
          <img id="sidebar-avatar" src="" alt="Avatar">
          <div class="user-info-text">
            <div class="name" id="sidebar-name">İsim</div>
            <div class="handle" id="sidebar-handle">@kullanici</div>
          </div>
        </div>
      </div>
    </sidebar>

    <!-- Main Content -->
    <main id="main-content-area">
      <!-- Dynamic Views injected by renderer.js -->
    </main>

    <!-- Right Widget Panel -->
    <aside class="right-panel">
      <div class="widget-box">
        <div class="widget-title">🔍 Kullanıcı Ara</div>
        <input type="text" id="user-search-input" placeholder="Kullanıcı ara..." oninput="searchUsers(this.value)">
        <div id="search-results" style="margin-top: 10px; max-height: 250px; overflow-y: auto;"></div>
      </div>
    </aside>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
